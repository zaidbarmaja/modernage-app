<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Play icon 512x512</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; background: #fff; }
  /* أيقونة متجر Google Play: 512×512، بلا شفافية، وبنفس أيقونة التطبيق
     المثبّتة على الهاتف (assets/images/app_icon.png). */
  img { width: 512px; height: 512px; display: block; }
</style>
</head>
<body>
  <img src="../../assets/images/app_icon.png" alt="">
</body>
</html>
